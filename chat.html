<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Give The Topic which you want to research:</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
    }
    #chatbox {
        width: 100%;
        max-width: 700px;
        margin: 40px auto;
        background: white;
        border-radius: 30px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #messages {
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 30px;
        background: #fafafa;
    }
    .msg {
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 6px;
        max-width: 80%;
    }
    .user {
        background: #d1e7ff;
        align-self: flex-end;
    }
    .bot {
        background: #e8e8e8;
    }
    #input-area {
        margin-top: 20px;
        display: flex;
    }
    #message {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border-radius: 20px;
        border: 1px solid #ccc;
    }
    #send {
        padding: 10px 20px;
        margin-left: 10px;
        font-size: 16px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
    #send:hover {
        background: #0056b3;
    }
</style>
</head>
<body>

<div id="chatbox">
    <h2>Research a Topic with Agents</h2>

    <div id="messages"></div>

    <div id="input-area">
        <input id="message" type="text" placeholder="Ask your question about a topic...">
        <button id="send">Send</button>
    </div>
</div>

<script>
    const API_URL = "/ask";

    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send");

    function addMessage(text, sender) {
        const div = document.createElement("div");
        div.className = "msg " + sender;
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const userText = input.value.trim();
        if (!userText) return;

        addMessage(userText, "user");
        input.value = "";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userText })
            });

            const data = await response.json();

            addMessage(data.answer || "No response from server.", "bot");

        } catch (err) {
            addMessage("Error: " + err.message, "bot");
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
